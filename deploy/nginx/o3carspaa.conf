# ══════════════════════════════════════════════════════════════════════════════
# O3 Car Spaa — Production Nginx Configuration (Hostinger VPS)
# Reverse Proxy, SSL Termination, WebSocket Upgrade, Rate Limiting & Gzip
# ══════════════════════════════════════════════════════════════════════════════

# ── 1. Upstream PM2 Cluster ──────────────────────────────────────────────────
upstream o3_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ── 2. Rate Limiting Zones ────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=o3_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=o3_auth_limit:10m rate=5r/s;

# ── 3. Port 80: HTTP to HTTPS Redirect ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.o3carspaa.com api.o3carspaa.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 4. Port 443: HTTPS Production Server ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.o3carspaa.com api.o3carspaa.com;

    # ── SSL Certificate & Hardening ──────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/app.o3carspaa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.o3carspaa.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Performance: Gzip Compression ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Upload Body Limit (Car photos, signatures, inspection PDFs) ───────────
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # ── Frontend SPA Static Root ─────────────────────────────────────────────
    root /var/www/o3-car-spaa/client/dist;
    index index.html;

    # ── Static Asset Long-Term Caching ───────────────────────────────────────
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── Persistent Uploads (Job photos, bills, warranty PDFs) ────────────────
    location /uploads/ {
        alias /var/www/o3-car-spaa/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ── Backend API Proxy ────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=o3_api_limit burst=30 nodelay;

        proxy_pass http://o3_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Strict Rate Limiting on Authentication Endpoints ─────────────────────
    location /api/auth/ {
        limit_req zone=o3_auth_limit burst=10 nodelay;

        proxy_pass http://o3_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket Reverse Proxy (Socket.io Realtime Notifications) ───────────
    location /socket.io/ {
        proxy_pass http://o3_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Frontend SPA Route Fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
