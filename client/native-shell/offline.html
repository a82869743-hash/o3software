<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O3 Car Spaa</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Roboto, sans-serif; background: #008DD2; color: #fff; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { font-size: 20px; margin: 18px 0 8px; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; opacity: .92; max-width: 320px; }
    button { background: #fff; color: #0369A1; border: 0; border-radius: 12px; padding: 14px 32px; font-size: 16px; font-weight: 700; }
    svg { opacity: .95; }
  </style>
</head>
<body>
  <div class="wrap">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2.1-1.6"/><path d="M2 8.8a15 15 0 0 1 4.2-2.7"/><path d="M22 8.8a15 15 0 0 0-11.3-3.7"/><path d="m2 2 20 20"/>
    </svg>
    <h1>No internet connection</h1>
    <p>O3 Car Spaa needs the internet. Check your mobile data or Wi-Fi, then try again.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    function retry() { window.location.replace('https://o3carspa.cloud/'); }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
